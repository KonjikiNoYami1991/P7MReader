name: Build

# Compila P7MReader per Windows, macOS (Apple Silicon e Intel) e Linux.
# - Avvio manuale: scheda Actions -> Build -> Run workflow (i pacchetti si scaricano dagli "Artifacts" della run)
# - Tag "v*" (es. v3.1.0): oltre agli artifacts crea una Release con tutti i pacchetti allegati
# - Avvio manuale con "release" compilato (es. v3.1.0): GitHub crea il tag sul commit compilato e la Release
# - Chiamato da prove-sistemi.yml: compila e basta; i pacchetti vengono poi provati sulle varie distribuzioni
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag della Release da creare (es. v3.1.0); vuoto = solo artifacts"
        required: false
        default: ""
  push:
    tags: ["v*"]
  # Riusato da "Prove sui sistemi" (prove-sistemi.yml): solo compilazione, nessuna Release
  workflow_call:
    inputs:
      release:
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows-x64
          - os: macos-15
            nome: macos-arm64
          - os: macos-15-intel
            nome: macos-x86_64
          # glibc 2.35: l'AppImage gira su Debian 12+, Ubuntu 22.04+, Fedora 36+, Arch, openSUSE Tumbleweed...
          - os: ubuntu-22.04
            nome: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libfontconfig1 libdbus-1-3 file desktop-file-utils

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          NO_VENV: "1"
          PYTHON: python
        run: bash ./build_p7mreader.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyQt6 asn1crypto pyhanko pyhanko-certvalidator cryptography lxml certifi tzdata
          python packaging/aggiorna_tsl.py
          $ver = python packaging/versione.py
          python -m PyInstaller --noconfirm --clean P7MReader.spec
          $p = Start-Process -FilePath dist/P7MReader.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:APPDATA/P7MReader/errori.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Selftest dell'exe fallito (codice $($p.ExitCode))" }
          Move-Item dist/P7MReader.exe "dist/P7MReader-$ver-windows-x64.exe"

      - name: Prova di avvio (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: QT_QPA_PLATFORM=offscreen dist/P7MReader.app/Contents/MacOS/P7MReader --selftest

      - name: Prova di avvio (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          chmod +x dist/*.AppImage
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 timeout 120 dist/*.AppImage --selftest

      - uses: actions/upload-artifact@v7
        with:
          name: P7MReader-${{ matrix.nome }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pacchetti
          merge-multiple: true
      - name: Impronte SHA-256
        run: cd pacchetti && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: P7MReader ${{ inputs.release || github.ref_name }}
          files: pacchetti/*
          generate_release_notes: true
