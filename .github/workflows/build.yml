name: Build

# Compila P7MReader per Windows, macOS (Apple Silicon e Intel) e Linux.
# - Avvio manuale: scheda Actions -> Build -> Run workflow (i pacchetti si scaricano dagli "Artifacts" della run)
# - Tag "v*" (es. v3.1.0): oltre agli artifacts crea una Release con tutti i pacchetti allegati
# - Avvio manuale con "release" compilato (es. v3.1.0): GitHub crea il tag sul commit compilato e la Release.
#   Se il tag esiste gia' (rilancio) si ricompila il commit del tag e si sostituiscono pacchetti e note della Release
# - Chiamato da prove-sistemi.yml: compila e basta; i pacchetti vengono poi provati sulle varie distribuzioni
# Le note della Release sono la sezione della versione nel changelog in testa a P7MReader.py (packaging/note_release.py):
# senza quella sezione la Release non viene creata.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag della Release da creare (es. v3.1.0); vuoto = solo artifacts"
        required: false
        default: ""
  push:
    tags: ["v*"]
  # Riusato da "Prove sui sistemi" (prove-sistemi.yml): solo compilazione, nessuna Release
  workflow_call:
    inputs:
      release:
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Che cosa si compila: per una Release su un tag che esiste gia' (rilancio) il commit del tag, non l'ultimo di main;
  # altrimenti il commit che ha avviato il workflow.
  prepara:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha 2>/dev/null)"; then
            echo "Il tag $TAG esiste gia' (commit $sha): si ricompila quel commit"
            echo "ref=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "Si compila il commit $GITHUB_SHA"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepara
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows-x64
          - os: macos-15
            nome: macos-arm64
          - os: macos-15-intel
            nome: macos-x86_64
          # glibc 2.35: l'AppImage gira su Debian 12+, Ubuntu 22.04+, Fedora 36+, Arch, openSUSE Tumbleweed...
          - os: ubuntu-22.04
            nome: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepara.outputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libfontconfig1 libdbus-1-3 file desktop-file-utils

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          NO_VENV: "1"
          PYTHON: python
        run: bash ./build_p7mreader.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyQt6 asn1crypto pyhanko pyhanko-certvalidator cryptography lxml certifi tzdata
          python packaging/aggiorna_tsl.py
          $ver = python packaging/versione.py
          python -m PyInstaller --noconfirm --clean P7MReader.spec
          $p = Start-Process -FilePath dist/P7MReader.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:APPDATA/P7MReader/errori.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Selftest dell'exe fallito (codice $($p.ExitCode))" }
          Move-Item dist/P7MReader.exe "dist/P7MReader-$ver-windows-x64.exe"

      - name: Prova di avvio (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: QT_QPA_PLATFORM=offscreen dist/P7MReader.app/Contents/MacOS/P7MReader --selftest

      - name: Prova di avvio (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          chmod +x dist/*.AppImage
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 timeout 120 dist/*.AppImage --selftest

      - name: Prova dell'aggiornatore integrato (server locale, programma finto)
        timeout-minutes: 10
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/prova_aggiornamento.py

      - uses: actions/upload-artifact@v7
        with:
          name: P7MReader-${{ matrix.nome }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: needs.prepara.outputs.tag != ''
    needs: [prepara, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepara.outputs.tag }}
      COMMIT: ${{ needs.prepara.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepara.outputs.ref }}

      - name: Note della release dal changelog di P7MReader.py
        run: python3 packaging/note_release.py "$TAG" > "$RUNNER_TEMP/note.md" && cat "$RUNNER_TEMP/note.md"

      - uses: actions/download-artifact@v8
        with:
          path: pacchetti
          merge-multiple: true

      - name: Impronte SHA-256
        run: cd pacchetti && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Con gh e non con softprops/action-gh-release: aggiornando una Release esistente quell'azione rimanda anche il
      # commit, e GitHub rifiuta la modifica al GITHUB_TOKEN se il commit cambia file in .github/workflows.
      - name: Pubblica la Release (nuova) o sostituisci pacchetti e note (gia' esistente)
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La Release $TAG esiste: si sostituiscono pacchetti e note"
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body >> "$RUNNER_TEMP/note.md" || true
            gh release upload "$TAG" pacchetti/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/note.md"
          else
            gh release create "$TAG" pacchetti/* --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
              --title "P7MReader $TAG" --notes-file "$RUNNER_TEMP/note.md" --generate-notes
          fi
