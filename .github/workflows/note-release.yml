name: Note delle release

# Riscrive SOLO il testo di una Release gia' pubblicata con la sezione del changelog di P7MReader.py
# (packaging/note_release.py). Non ricompila e non tocca i pacchetti allegati.
# Avvio: scheda Actions -> Note delle release -> Run workflow, indicando il tag (es. v3.2.0).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della Release da aggiornare (es. v3.2.0)"
        required: true

permissions:
  contents: write

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Note dal changelog
        run: python3 packaging/note_release.py "${{ inputs.tag }}" > "$RUNNER_TEMP/note.md" && cat "$RUNNER_TEMP/note.md"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          body_path: ${{ runner.temp }}/note.md
          generate_release_notes: true
